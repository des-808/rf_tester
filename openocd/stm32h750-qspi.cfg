# OpenOCD configuration for STM32H750 with QSPI XIP
# This script configures the QSPI flash bank for programming

# Source the default ST-Link and STM32H7 configuration
source [find interface/stlink.cfg]
source [find target/stm32h7x.cfg]

# Additional QSPI configuration for XIP mode
# QSPI parameters for STM32H750
set QSPI_PAGESIZE 256
set QSPI_SECTORSIZE 4096
set QSPI_SIZE 0x1000000

# Configure QSPI flash bank
# flash bank <name> stm32f1x <base> <size> <chip_width> <bus_width> <target> [options]
# For QSPI: flash bank <name> stmqspi <base> <size> 0 0 <target>

# Add QSPI as a second flash bank
set _QSPI_ADDR 0x90000000
set _QSPI_SIZE 0x1000000

# Erase and program QSPI
# The QSPI is memory-mapped starting at 0x90000000
# It's 16MB in size (0x1000000)

# Optional: Add QSPI flash bank if supported
# flash bank qspi_bank stmqspi $_QSPI_ADDR $_QSPI_SIZE 0 0 $_TARGETNAME

# Workaround: disable verify for QSPI since it's XIP
# verify_image disable

# Alternative approach: use standard STM32 config and disable QSPI verification
