; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB
framework = stm32cube

; Оптимизация для размера
build_flags = 
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  ;-Wl,-T${platformio.root_dir}/linker/STM32H750VBTX_FLASH.ld
  ; ← FLASH linker
  


; Использовать STM32CubeProgrammer CLI для QSPI
;upload_protocol = dfu
;upload_protocol = custom
;upload_command = "C:\\Program Files\\STMicroelectronics\\STM32Cube\\STM32CubeProgrammer\\bin\\STM32_Programmer_CLI.exe" -c port=SWD mode=UR speed=4000 -w .pio\\build\\genericSTM32H750VB\\firmware.elf -v -rst
upload_protocol = stlink

; QSPI XIP linker script
board_build.ldscript = linker/STM32H750VBTX_FLASH.ld

; Отладка - ST-Link
debug_tool = stlink
debug_init_break = tbreak main
debug_speed = 4000



