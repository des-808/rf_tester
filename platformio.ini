; PlatformIO Project Configuration File
;
; STM32H750VBT6 - WeAct Mini Board

[env:weact_mini_h750vbtx]
platform = ststm32
board = weact_mini_h750vbtx
framework = stm32cube



; Оптимизация для размера
build_flags = 
	-O2
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Iinclude
	-Isrc/st7796
	-DUSBD_MAX_NUM_INTERFACES=1

board_build.ldscript = linker/STM32H750VBTX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main
debug_speed = 4000
