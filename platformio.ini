;[env:genericSTM32H750VB]
;platform = ststm32
;board = genericSTM32H743VI
;framework = stm32cube

; Оптимизация для размера
;build_flags = 
;	-O2
;	-ffunction-sections
;	-fdata-sections
;	-Wl,--gc-sections
;	-Iinclude
;	-Isrc/st7796
;	-Isrc/measurement
;	-DUSBD_MAX_NUM_INTERFACES=1

;board_build.ldscript = linker/STM32H743VITX_FLASH.ld
