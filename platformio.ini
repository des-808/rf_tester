; PlatformIO Project Configuration File
;
; STM32H750VBT6 - WeAct Mini Board
; Модульная структура: src/core/ + src/modules/

;[env:weact_mini_h750vbtx]
;platform = ststm32
;board = weact_mini_h750vbtx
;framework = stm32cube
;platform_packages =
 ;toolchain-gccarmnoneeabi@~1.90301.0

; LVGL: локальная копия (без helium/neon)
;lib_deps =
;	lvgl

; Оптимизация для размера
;build_flags = 
;	-O2
;	-ffunction-sections
;	-fdata-sections
;	-Wl,--gc-sections
;	-Iinclude
;	-Isrc/core
;	-Isrc/core/st7796
;	-Isrc/core/lvgl
;	-Isrc/modules
;	-Ilib/cJSON
;	-Ifatfs
;	-Ilib
;	-DUSE_FATFS=1
;	-DUSE_LFN=0
;	-D_CODE_PAGE=932
;	-DFF_FS_EXFAT=0
;	-DFF_FS_NORTC=1
;	-DFF_FS_MINIMIZE=2
;	-USBD_MAX_NUM_INTERFACES=1
	
;	-DLV_USE_STM32_DMA2D=1
;	-DLV_USE_STM32_DMA=1
;	-DLV_DRAW_SW_ASM=0
;	-DLV_USE_NATIVE_HELIUM_ASM=0

;board_build.ldscript = linker/STM32H750VBTX_FLASH.ld

;upload_protocol = stlink
;debug_tool = stlink
;debug_init_break = tbreak main
;debug_speed = 4000

;monitor_port = COM5
;monitor_speed = 115200

[env:weact_mini_h743vitx]
platform = ststm32
board = weact_mini_h743vitx
framework = stm32cube

; Оптимизация для размера
lib_deps = lvgl/lvgl@^9.5.0

build_flags = 
	-O2
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Iinclude
	-Isrc/core/lvgl
	-Isrc/core/st7796
	-Isrc/core/usb
	-Isrc/core
	-Isrc/modules/radio
	-Isrc/modules
	-I.pio/libdeps/weact_mini_h743vitx/lvgl
	-DUSBD_MAX_NUM_INTERFACES=1

board_build.ldscript = linker/STM32H743VIT_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main
debug_speed = 4000

monitor_port = COM5
monitor_speed = 115200
