; PlatformIO Project Configuration File
;
; STM32H750VB - Custom GUI (NO LVGL)

[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB
framework = stm32cube

; Оптимизация для размера
build_flags = 
	-O2
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Iinclude
	-Isrc/st7796
	-Isrc/measurement
	-DUSBD_MAX_NUM_INTERFACES=1

board_build.ldscript = linker/STM32H750VBTX_FLASH.ld
upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main
debug_speed = 4000
