; PlatformIO Project Configuration File
;
; STM32H750VBT6 - WeAct Mini Board
; Модульная структура: src/core/ + src/modules/

[env:weact_mini_h750vbtx]
platform = ststm32
board = weact_mini_h750vbtx
framework = stm32cube

; LVGL: локальная копия (без helium/neon)
lib_deps =
	lvgl

; Оптимизация для размера
build_flags = 
	-O2
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Iinclude
	-Isrc/core
	-Isrc/core/st7796
	-Isrc/core/lvgl
	-Isrc/modules
	-Ilib/cJSON
	-Ifatfs
	-Ilib
	-DUSE_FATFS=1
	-DUSE_LFN=0
	-D_CODE_PAGE=932
	-DFF_FS_EXFAT=0
	-DFF_FS_NORTC=1
	-DFF_FS_MINIMIZE=2
	-DUSBD_MAX_NUM_INTERFACES=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_USE_STM32_DMA2D=1
	-DLV_USE_STM32_DMA=1

board_build.ldscript = linker/STM32H750VBTX_FLASH.ld

upload_protocol = stlink
debug_tool = stlink
debug_init_break = tbreak main
debug_speed = 4000

monitor_port = COM5
monitor_speed = 115200
